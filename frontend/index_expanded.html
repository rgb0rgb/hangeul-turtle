<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Home Shield v3 실험실</title>
<style>body{font-family:system-ui,sans-serif;max-width:1000px;margin:2rem auto;padding:0 1rem;background:#f4f7fb;color:#172033}main{background:#fff;border-radius:16px;padding:1.5rem;box-shadow:0 4px 18px #20304a18}button{margin:.25rem;padding:.65rem 1rem;border:0;border-radius:8px;background:#1c6ef2;color:#fff;cursor:pointer}.tag{padding:.25rem .5rem;border-radius:1rem;background:#e7f0ff}.warning{background:#fff3cd;padding:.8rem;border-radius:8px}.row{border-top:1px solid #ddd;padding:1rem 0}.good{color:#087f5b;font-weight:bold}.bad{color:#b42318;font-weight:bold}</style></head>
<body><main><h1>AI Home Shield v3 실험실</h1><p class="warning">데모 전용: 실제 네트워크 공격·차단이 아니라 승인된 합성 시나리오만 실행합니다. 정책은 항상 dry-run이며 관리자 승인이 필요합니다.</p>
<h2>Red → Blue 실험</h2><div id="buttons"></div><button onclick="repeatExperiment()">10회 반복 성능 비교</button><p id="status">상태를 불러오는 중…</p><h2>최근 결과</h2><div id="events"></div><h2>독립 평가</h2><div id="experiments">아직 반복 평가가 없습니다.</div><h2>실제 CyberBattleSim 결과</h2><div id="cyberbattle">실행 결과 없음</div></main>
<h2>로컬 AI 상태</h2><div id="models">상태 불러오는 중…</div><script>
const token=prompt('실험 토큰을 입력하세요','demo-token')||'';
async function refresh(){const d=await(await fetch('/api/v1/state')).json();document.querySelector('#models').textContent=d.slm?`Red AI: 승인 시나리오 선택 전용 · Blue AI: ${d.slm.provider} ${d.slm.model} · ${d.slm.status} · 가중치 학습 아님 · 정책 dry-run`:'';
document.querySelector('#buttons').innerHTML=d.scenario_catalog.map(s=>`<button onclick="runScenario('${s}')">${s} 실행</button>`).join('');
document.querySelector('#events').innerHTML=d.events.map(e=>`<div class="row"><b>${e.scenario_id}</b> · seed ${e.seed} · ${e.latency_ms} ms<br>Red: ${e.red.event_count}개 이벤트 → Blue: ${e.blue.detected_count}개 탐지 · <span class="${e.success?'good':'bad'}">${e.success?'탐지 성공':'재검토 필요'}</span><br><span class="tag">${e.policy_mode}</span> <span class="tag">승인 필요</span></div>`).join('')||'<p>아직 실행 결과가 없습니다.</p>';
document.querySelector('#experiments').innerHTML=(d.experiments||[]).map(x=>`<div class="row">${x.repetitions}회 · 규칙 탐지율 ${(x.rules_baseline.detection_rate*100).toFixed(1)}% · Blue 결합 ${(x.rules_plus_blue.detection_rate*100).toFixed(1)}% · 규칙 오탐 ${(x.rules_baseline.false_positive_rate*100).toFixed(1)}% · Blue 오탐 ${(x.rules_plus_blue.false_positive_rate*100).toFixed(1)}% · P95 ${x.rules_plus_blue.p95_latency_ms.toFixed(3)}ms</div>`).join('')||'아직 반복 평가가 없습니다.';
document.querySelector('#cyberbattle').innerHTML=d.cyberbattle?`<div class="row"><b>실제 실행</b> · ${d.cyberbattle.episode_count}회 · Blue observation ${d.cyberbattle.blue_observation_count}건 · 외부 네트워크 없음<br>각 episode는 seed별 3 step이며 response는 observe-only/dry-run입니다.</div>`:'실행 결과 없음';
document.querySelector('#status').textContent=`합성 실험 ${d.events.length}건 · 실제 운영망 연결 없음`}
async function runScenario(s){const r=await fetch('/api/v1/red/events',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({scenario_id:s,seed:Date.now()%100000})});document.querySelector('#status').textContent=r.ok?'실험 결과를 수신했습니다.':'인증 또는 입력 오류입니다.';refresh()}
async function repeatExperiment(){const r=await fetch('/api/v1/experiments/repeat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({repetitions:10})});document.querySelector('#status').textContent=r.ok?'반복 평가가 완료되었습니다.':'반복 평가 오류입니다.';refresh()} refresh();
</script></body></html>
